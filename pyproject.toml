[project]
name = "noc-agent"
version = "0.1.0"
description = "4G EPC NOC assistant using Claude Agent SDK in-process MCP tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.174",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
